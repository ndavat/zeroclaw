services:
  - type: web
    name: zeroclaw-gateway
    env: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerfileTarget: release
    envVars:
      - key: ZEROCLAW_ALLOW_PUBLIC_BIND
        value: "true"
      - key: ZEROCLAW_GATEWAY_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: PROVIDER
        value: groq
      - key: ZEROCLAW_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
